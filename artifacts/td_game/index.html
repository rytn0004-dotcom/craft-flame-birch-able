<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狐仙塔防 - Fox Spirit Tower Defense</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a1628;
    color: #e0f0ff;
    font-family: 'Noto Sans TC', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1 {
    margin: 10px 0 5px;
    font-size: 1.8rem;
    background: linear-gradient(90deg, #ff9ecd, #7ecbff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(255,158,205,0.4);
  }
  #game-container {
    position: relative;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 8px;
  }
  #canvas-wrap {
    position: relative;
    border: 3px solid #3a6a9a;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(60,140,220,0.35);
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #0d2137;
    cursor: crosshair;
  }
  #ui-panel {
    width: 280px;
    background: rgba(10,30,50,0.92);
    border: 2px solid #2a5a8a;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 720px;
    overflow-y: auto;
  }
  .stat-bar {
    display: flex;
    justify-content: space-between;
    background: rgba(20,50,80,0.7);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .stat-bar span { font-weight: 700; }
  #gold { color: #ffd700; }
  #lives { color: #ff6b6b; }
  #wave { color: #7ecbff; }
  .section-title {
    font-size: 0.85rem;
    color: #8ab4d9;
    margin-top: 4px;
    border-bottom: 1px solid #2a4a6a;
    padding-bottom: 3px;
  }
  .tower-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(30,60,90,0.8);
    border: 2px solid #3a6a9a;
    border-radius: 10px;
    padding: 6px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .tower-btn:hover, .tower-btn.selected {
    border-color: #ff9ecd;
    background: rgba(60,40,70,0.9);
    box-shadow: 0 0 12px rgba(255,158,205,0.4);
  }
  .tower-btn img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid #5a8aba;
  }
  .tower-info {
    flex: 1;
    font-size: 0.75rem;
    line-height: 1.3;
  }
  .tower-name { font-weight: 700; color: #ffcce0; font-size: 0.85rem; }
  .tower-cost { color: #ffd700; }
  .tower-spec { color: #a0e0ff; font-size: 0.7rem; }
  #selected-info {
    background: rgba(40,20,50,0.85);
    border: 1px solid #6a3a7a;
    border-radius: 8px;
    padding: 8px;
    font-size: 0.8rem;
    min-height: 70px;
  }
  .upgrade-btns {
    display: flex;
    gap: 6px;
  }
  .upgrade-btns button {
    flex: 1;
    padding: 6px;
    border: none;
    border-radius: 6px;
    background: #2a6a4a;
    color: #fff;
    cursor: pointer;
    font-size: 0.75rem;
  }
  .upgrade-btns button:hover { background: #3a8a5a; }
  .upgrade-btns button:disabled { background: #333; color: #777; cursor: not-allowed; }
  #start-btn, #restart-btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #ff6b9d, #c44dff);
    color: white;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 6px;
  }
  #start-btn:hover, #restart-btn:hover { filter: brightness(1.15); }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(5,15,30,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    border-radius: 10px;
  }
  #overlay h2 { font-size: 2.2rem; margin-bottom: 12px; }
  #overlay p { margin-bottom: 20px; color: #a0c8e8; }
  .hidden { display: none !important; }
  #msg {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 5;
  }
  #msg.show { opacity: 1; }
</style>
</head>
<body>
  <h1>🦊 狐仙塔防 · Fox Spirit TD</h1>
  <div id="game-container">
    <div id="canvas-wrap">
      <canvas id="game" width="900" height="600"></canvas>
      <div id="msg"></div>
      <div id="overlay">
        <h2 id="overlay-title">準備開始</h2>
        <p id="overlay-desc">放置狐仙守護者，阻止怪物入侵！</p>
        <button id="start-btn">開始遊戲</button>
      </div>
    </div>
    <div id="ui-panel">
      <div class="stat-bar"><span>❤️ 生命</span><span id="lives">20</span></div>
      <div class="stat-bar"><span>💰 金幣</span><span id="gold">150</span></div>
      <div class="stat-bar"><span>🌊 波次</span><span id="wave">0 / 15</span></div>
      <div class="section-title">選擇守護者（依圖片順序，越後越強）</div>
      <div id="tower-list"></div>
      <div class="section-title">選中塔資訊 / 升級</div>
      <div id="selected-info">點擊地圖上的塔進行升級</div>
      <div class="upgrade-btns">
        <button id="up-dmg" disabled>升級傷害 +25%</button>
        <button id="up-rate" disabled>升級射速 +20%</button>
      </div>
      <button id="restart-btn" class="hidden">重新開始</button>
    </div>
  </div>

<script>
// ==================== CONFIG & DATA ====================
const CANVAS_W = 900, CANVAS_H = 600;
const GRID = 40; // placement grid size
const PATH = [ // waypoints
  {x:0, y:280}, {x:160, y:280}, {x:160, y:120}, {x:360, y:120},
  {x:360, y:420}, {x:560, y:420}, {x:560, y:200}, {x:760, y:200},
  {x:760, y:480}, {x:900, y:480}
];

const TOWERS = [
  { id:0, name:"銀月狐仙", img:"img/tower1.png", cost:50, range:130, damage:18, fireRate:900,
    special:"high_dmg", desc:"高傷害單點射擊", color:"#a0d0ff" },
  { id:1, name:"寒霜狐仙", img:"img/tower2.png", cost:75, range:110, damage:10, fireRate:800,
    special:"slow", desc:"攻擊使敵人減速 40%", color:"#7ecbff" },
  { id:2, name:"烈焰狐仙", img:"img/tower4.png", cost:95, range:120, damage:12, fireRate:1000,
    special:"burn", desc:"燃燒：每秒 8 傷害，持續 3 秒", color:"#ff8c5a" },
  { id:3, name:"疾風狐仙", img:"img/tower6.png", cost:110, range:100, damage:9, fireRate:380,
    special:"rapid", desc:"超高射速", color:"#c0a0ff" },
  { id:4, name:"星穹狐仙", img:"img/tower8.png", cost:140, range:150, damage:15, fireRate:1100,
    special:"aoe", desc:"範圍傷害（擊中後爆炸）", color:"#ff9ecd" },
  { id:5, name:"聖輝狐仙", img:"img/tower10.png", cost:160, range:140, damage:22, fireRate:950,
    special:"shield", desc:"擊中賦予護盾減傷 + 中等傷害", color:"#ffe08a" },
  { id:6, name:"縛影狐仙", img:"img/tower7.png", cost:180, range:115, damage:14, fireRate:850,
    special:"block", desc:"強力減速 + 短暫定身（阻擋）", color:"#d080ff" },
  { id:7, name:"究極狐仙", img:"img/tower12.png", cost:220, range:160, damage:35, fireRate:700,
    special:"ultimate", desc:"超高傷害 + 燃燒 + 減速", color:"#ff6b9d" }
];

const ENEMY_TYPES = [
  { name:"小妖", hp:40, speed:1.1, gold:8, color:"#6a9", radius:12 },
  { name:"狼妖", hp:90, speed:0.95, gold:18, color:"#a86", radius:14 },
  { name:"石魔", hp:180, speed:0.7, gold:32, color:"#789", radius:16 },
  { name:"炎魔", hp:260, speed:0.85, gold:45, color:"#c64", radius:15 },
  { name:"魔將", hp:420, speed:0.65, gold:70, color:"#a3a", radius:18 },
  { name:"妖王", hp:700, speed:0.55, gold:120, color:"#f48", radius:20 }
];

// ==================== STATE ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let gold = 150, lives = 20, wave = 0, maxWave = 15;
let selectedTowerType = null;
let selectedPlaced = null;
let towers = [];
let enemies = [];
let projectiles = [];
let particles = [];
let effects = []; // floating text, auras
let gameRunning = false;
let lastTime = 0;
let spawnQueue = [];
let spawnTimer = 0;
let images = {};
let mouse = {x:0, y:0};
let pathBlocked = new Set(); // grid cells occupied by path

// ==================== INIT ====================
function buildPathBlocked() {
  for (let i = 0; i < PATH.length - 1; i++) {
    const a = PATH[i], b = PATH[i+1];
    const steps = Math.max(Math.abs(b.x-a.x), Math.abs(b.y-a.y)) / 10;
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const x = a.x + (b.x - a.x) * t;
      const y = a.y + (b.y - a.y) * t;
      const gx = Math.floor(x / GRID), gy = Math.floor(y / GRID);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        pathBlocked.add(`${gx+dx},${gy+dy}`);
      }
    }
  }
}

function loadImages() {
  return Promise.all(TOWERS.map(t => {
    return new Promise(res => {
      const img = new Image();
      img.src = t.img;
      img.onload = () => { images[t.id] = img; res(); };
      img.onerror = () => res();
    });
  }));
}

function initUI() {
  const list = document.getElementById('tower-list');
  list.innerHTML = '';
  TOWERS.forEach(t => {
    const btn = document.createElement('div');
    btn.className = 'tower-btn';
    btn.dataset.id = t.id;
    btn.innerHTML = `
      <img src="${t.img}" alt="${t.name}">
      <div class="tower-info">
        <div class="tower-name">${t.name}</div>
        <div class="tower-cost">💰 ${t.cost}</div>
        <div class="tower-spec">${t.desc}</div>
        <div style="font-size:0.65rem;color:#8ab">射程${t.range} 傷害${t.damage} 射速${(1000/t.fireRate).toFixed(1)}/s</div>
      </div>`;
    btn.onclick = () => {
      document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedTowerType = t.id;
      selectedPlaced = null;
      updateSelectedInfo();
    };
    list.appendChild(btn);
  });
}

function updateSelectedInfo() {
  const el = document.getElementById('selected-info');
  const upD = document.getElementById('up-dmg');
  const upR = document.getElementById('up-rate');
  if (selectedPlaced !== null) {
    const tw = towers[selectedPlaced];
    const base = TOWERS[tw.type];
    el.innerHTML = `
      <b style="color:${base.color}">${base.name}</b> Lv.${tw.level}<br>
      傷害: ${tw.damage.toFixed(0)} | 射速: ${(1000/tw.fireRate).toFixed(2)}/s<br>
      射程: ${tw.range} | 特殊: ${base.desc}<br>
      下級費用: 傷害 ${Math.floor(40 * tw.level)} / 射速 ${Math.floor(35 * tw.level)}
    `;
    upD.disabled = gold < Math.floor(40 * tw.level);
    upR.disabled = gold < Math.floor(35 * tw.level);
  } else if (selectedTowerType !== null) {
    const t = TOWERS[selectedTowerType];
    el.innerHTML = `<b style="color:${t.color}">${t.name}</b><br>${t.desc}<br>點擊地圖空白處放置（不可放在路徑上）`;
    upD.disabled = true; upR.disabled = true;
  } else {
    el.innerHTML = '點擊地圖上的塔進行升級，或選擇左側守護者放置';
    upD.disabled = true; upR.disabled = true;
  }
}

document.getElementById('up-dmg').onclick = () => {
  if (selectedPlaced === null) return;
  const tw = towers[selectedPlaced];
  const cost = Math.floor(40 * tw.level);
  if (gold >= cost) {
    gold -= cost;
    tw.damage *= 1.25;
    tw.level++;
    showMsg(`傷害升級！現在 ${tw.damage.toFixed(0)}`);
    updateUI();
    updateSelectedInfo();
  }
};
document.getElementById('up-rate').onclick = () => {
  if (selectedPlaced === null) return;
  const tw = towers[selectedPlaced];
  const cost = Math.floor(35 * tw.level);
  if (gold >= cost) {
    gold -= cost;
    tw.fireRate = Math.max(200, tw.fireRate * 0.8);
    tw.level++;
    showMsg(`射速升級！`);
    updateUI();
    updateSelectedInfo();
  }
};

// ==================== GAME LOGIC ====================
function canPlace(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= CANVAS_W/GRID || gy >= CANVAS_H/GRID) return false;
  if (pathBlocked.has(`${gx},${gy}`)) return false;
  for (const t of towers) {
    if (Math.floor(t.x/GRID) === gx && Math.floor(t.y/GRID) === gy) return false;
  }
  return true;
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * (CANVAS_W / rect.width);
  mouse.y = (e.clientY - rect.top) * (CANVAS_H / rect.height);
});

canvas.addEventListener('click', e => {
  if (!gameRunning) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (CANVAS_W / rect.width);
  const my = (e.clientY - rect.top) * (CANVAS_H / rect.height);

  // check click on existing tower
  for (let i = 0; i < towers.length; i++) {
    const t = towers[i];
    if (Math.hypot(t.x - mx, t.y - my) < 28) {
      selectedPlaced = i;
      selectedTowerType = null;
      document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
      updateSelectedInfo();
      return;
    }
  }

  if (selectedTowerType !== null) {
    const gx = Math.floor(mx / GRID), gy = Math.floor(my / GRID);
    if (canPlace(gx, gy)) {
      const base = TOWERS[selectedTowerType];
      if (gold >= base.cost) {
        gold -= base.cost;
        towers.push({
          type: selectedTowerType,
          x: gx * GRID + GRID/2,
          y: gy * GRID + GRID/2,
          damage: base.damage,
          fireRate: base.fireRate,
          range: base.range,
          lastShot: 0,
          level: 1,
          angle: 0
        });
        showMsg(`放置 ${base.name}`);
        updateUI();
      } else showMsg('金幣不足！');
    } else showMsg('無法放置在此處');
  }
});

function showMsg(txt) {
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

function updateUI() {
  document.getElementById('gold').textContent = gold;
  document.getElementById('lives').textContent = lives;
  document.getElementById('wave').textContent = `${wave} / ${maxWave}`;
}

function startWave() {
  if (wave >= maxWave) return;
  wave++;
  updateUI();
  const count = 6 + wave * 2;
  const typeIdx = Math.min(ENEMY_TYPES.length - 1, Math.floor((wave - 1) / 3));
  spawnQueue = [];
  for (let i = 0; i < count; i++) {
    // mix stronger as wave grows
    let ti = typeIdx;
    if (Math.random() < 0.25 && ti > 0) ti--;
    if (Math.random() < 0.15 + wave * 0.02) ti = Math.min(ENEMY_TYPES.length-1, ti + 1);
    spawnQueue.push({ type: ti, delay: i * (900 - wave * 25) });
  }
  // boss every 5 waves
  if (wave % 5 === 0) {
    spawnQueue.push({ type: Math.min(5, 3 + Math.floor(wave/5)), delay: count * 700 });
  }
  spawnTimer = 0;
  showMsg(`第 ${wave} 波來襲！`);
}

function spawnEnemy(typeIdx) {
  const et = ENEMY_TYPES[typeIdx];
  const hpScale = 1 + (wave - 1) * 0.18;
  enemies.push({
    type: typeIdx,
    x: PATH[0].x, y: PATH[0].y,
    hp: et.hp * hpScale,
    maxHp: et.hp * hpScale,
    speed: et.speed * (0.95 + Math.random()*0.1),
    baseSpeed: et.speed,
    gold: Math.floor(et.gold * (1 + wave * 0.12)),
    pathIdx: 0,
    progress: 0,
    slowTimer: 0, slowFactor: 1,
    burnTimer: 0, burnDps: 0,
    stunTimer: 0,
    radius: et.radius,
    color: et.color
  });
}

function getPathPos(idx, prog) {
  if (idx >= PATH.length - 1) return PATH[PATH.length-1];
  const a = PATH[idx], b = PATH[idx+1];
  return { x: a.x + (b.x-a.x)*prog, y: a.y + (b.y-a.y)*prog };
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.stunTimer > 0) { e.stunTimer -= dt; continue; }
    if (e.slowTimer > 0) { e.slowTimer -= dt; } else e.slowFactor = 1;
    if (e.burnTimer > 0) {
      e.burnTimer -= dt;
      e.hp -= e.burnDps * dt / 1000;
      if (Math.random() < 0.3) addParticle(e.x, e.y, '#ff6a2a', 1.5);
    }

    const dist = e.speed * e.slowFactor * dt * 0.06;
    e.progress += dist / 140; // approximate segment length
    if (e.progress >= 1) {
      e.progress = 0;
      e.pathIdx++;
      if (e.pathIdx >= PATH.length - 1) {
        lives--;
        enemies.splice(i, 1);
        updateUI();
        if (lives <= 0) endGame(false);
        continue;
      }
    }
    const pos = getPathPos(e.pathIdx, e.progress);
    e.x = pos.x; e.y = pos.y;

    if (e.hp <= 0) {
      gold += e.gold;
      addFloatingText(e.x, e.y, `+${e.gold}`, '#ffd700');
      // death particles
      for (let p = 0; p < 12; p++) addParticle(e.x, e.y, e.color, 3);
      enemies.splice(i, 1);
      updateUI();
    }
  }
}

function updateTowers(dt, now) {
  for (const tw of towers) {
    // find target
    let target = null, minD = tw.range;
    for (const e of enemies) {
      const d = Math.hypot(e.x - tw.x, e.y - tw.y);
      if (d < minD) { minD = d; target = e; }
    }
    if (target) {
      tw.angle = Math.atan2(target.y - tw.y, target.x - tw.x);
      if (now - tw.lastShot >= tw.fireRate) {
        tw.lastShot = now;
        fireProjectile(tw, target);
      }
    }
  }
}

function fireProjectile(tw, target) {
  const base = TOWERS[tw.type];
  const special = base.special;
  projectiles.push({
    x: tw.x, y: tw.y,
    tx: target.x, ty: target.y,
    target: target,
    speed: 6.5,
    damage: tw.damage,
    special: special,
    color: base.color,
    radius: special === 'aoe' ? 6 : 4,
    life: 2000
  });
  // muzzle flash
  for (let i = 0; i < 4; i++) addParticle(tw.x, tw.y, base.color, 2);
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= dt;
    if (p.life <= 0) { projectiles.splice(i,1); continue; }

    // home slightly if target alive
    if (p.target && enemies.includes(p.target)) {
      p.tx = p.target.x; p.ty = p.target.y;
    }
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 10) {
      // hit
      applyHit(p);
      projectiles.splice(i, 1);
      continue;
    }
    p.x += (dx / dist) * p.speed * (dt / 16);
    p.y += (dy / dist) * p.speed * (dt / 16);
    // trail
    if (Math.random() < 0.6) addParticle(p.x, p.y, p.color, 1.2);
  }
}

function applyHit(p) {
  const hitEnemies = [];
  if (p.special === 'aoe') {
    for (const e of enemies) {
      if (Math.hypot(e.x - p.x, e.y - p.y) < 70) hitEnemies.push(e);
    }
    // explosion particles
    for (let i = 0; i < 20; i++) addParticle(p.x, p.y, p.color, 4);
  } else {
    if (p.target && enemies.includes(p.target)) hitEnemies.push(p.target);
    else {
      // find nearest
      let nearest = null, nd = 40;
      for (const e of enemies) {
        const d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d < nd) { nd = d; nearest = e; }
      }
      if (nearest) hitEnemies.push(nearest);
    }
  }

  for (const e of hitEnemies) {
    let dmg = p.damage;
    if (p.special === 'shield') {
      // just high-ish damage, visual shield later
      dmg *= 1.1;
    }
    e.hp -= dmg;
    addFloatingText(e.x, e.y - 15, Math.floor(dmg), '#fff');

    if (p.special === 'slow' || p.special === 'block' || p.special === 'ultimate') {
      e.slowFactor = p.special === 'block' ? 0.25 : 0.55;
      e.slowTimer = p.special === 'block' ? 1800 : 2200;
      if (p.special === 'block') e.stunTimer = 400;
    }
    if (p.special === 'burn' || p.special === 'ultimate') {
      e.burnTimer = 3000;
      e.burnDps = p.special === 'ultimate' ? 14 : 8;
    }
    // hit particles
    for (let i = 0; i < 6; i++) addParticle(e.x, e.y, p.color, 2.5);
  }
}

function addParticle(x, y, color, speed) {
  particles.push({
    x, y,
    vx: (Math.random()-0.5)*speed*2,
    vy: (Math.random()-0.5)*speed*2 - 1,
    life: 400 + Math.random()*300,
    maxLife: 700,
    color,
    size: 2 + Math.random()*3
  });
}

function addFloatingText(x, y, text, color) {
  effects.push({ type:'text', x, y, text, color, life: 900, vy: -0.8 });
}

function updateParticles(dt) {
  for (let i = particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.04;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i = effects.length-1; i>=0; i--) {
    const ef = effects[i];
    ef.y += ef.vy;
    ef.life -= dt;
    if (ef.life <= 0) effects.splice(i,1);
  }
}

// ==================== RENDER ====================
function drawPath() {
  ctx.strokeStyle = 'rgba(80,140,200,0.35)';
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(PATH[0].x, PATH[0].y);
  for (let i=1; i<PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(120,180,255,0.15)';
  ctx.lineWidth = 28;
  ctx.stroke();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(50,90,130,0.12)';
  ctx.lineWidth = 1;
  for (let x=0; x<=CANVAS_W; x+=GRID) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CANVAS_H); ctx.stroke();
  }
  for (let y=0; y<=CANVAS_H; y+=GRID) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CANVAS_W,y); ctx.stroke();
  }
}

function drawTowers() {
  for (let i=0; i<towers.length; i++) {
    const tw = towers[i];
    const base = TOWERS[tw.type];
    const img = images[tw.type];

    // range when selected
    if (selectedPlaced === i) {
      ctx.beginPath();
      ctx.arc(tw.x, tw.y, tw.range, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,180,220,0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,180,220,0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // platform
    ctx.beginPath();
    ctx.arc(tw.x, tw.y, 26, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(20,40,70,0.85)';
    ctx.fill();
    ctx.strokeStyle = base.color;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    if (img) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(tw.x, tw.y, 22, 0, Math.PI*2);
      ctx.clip();
      ctx.drawImage(img, tw.x-22, tw.y-22, 44, 44);
      ctx.restore();
    } else {
      ctx.fillStyle = base.color;
      ctx.beginPath();
      ctx.arc(tw.x, tw.y, 18, 0, Math.PI*2);
      ctx.fill();
    }

    // level badge
    if (tw.level > 1) {
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('L'+tw.level, tw.x-8, tw.y+32);
    }
  }

  // placement preview
  if (selectedTowerType !== null && gameRunning) {
    const gx = Math.floor(mouse.x/GRID), gy = Math.floor(mouse.y/GRID);
    const px = gx*GRID + GRID/2, py = gy*GRID + GRID/2;
    const ok = canPlace(gx, gy);
    const base = TOWERS[selectedTowerType];
    ctx.beginPath();
    ctx.arc(px, py, base.range, 0, Math.PI*2);
    ctx.fillStyle = ok ? 'rgba(100,200,255,0.1)' : 'rgba(255,80,80,0.12)';
    ctx.fill();
    ctx.strokeStyle = ok ? 'rgba(100,200,255,0.4)' : 'rgba(255,80,80,0.5)';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(px, py, 22, 0, Math.PI*2);
    ctx.fillStyle = ok ? 'rgba(80,160,220,0.5)' : 'rgba(200,60,60,0.5)';
    ctx.fill();
  }
}

function drawEnemies() {
  for (const e of enemies) {
    // shadow
    ctx.beginPath();
    ctx.ellipse(e.x, e.y+8, e.radius*0.9, e.radius*0.35, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();

    // body
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
    ctx.fillStyle = e.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // slow / burn indicators
    if (e.slowTimer > 0) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius+4, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(100,200,255,0.7)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    if (e.burnTimer > 0) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius+6, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,100,40,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    if (e.stunTimer > 0) {
      ctx.fillStyle = 'rgba(200,150,255,0.5)';
      ctx.fillRect(e.x-8, e.y-e.radius-12, 16, 4);
    }

    // hp bar
    const bw = e.radius * 2.2;
    ctx.fillStyle = '#333';
    ctx.fillRect(e.x - bw/2, e.y - e.radius - 10, bw, 5);
    ctx.fillStyle = e.hp/e.maxHp > 0.4 ? '#4c4' : '#c44';
    ctx.fillRect(e.x - bw/2, e.y - e.radius - 10, bw * (e.hp/e.maxHp), 5);
  }
}

function drawProjectiles() {
  for (const p of projectiles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    // glow core
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius*0.5, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const ef of effects) {
    if (ef.type === 'text') {
      ctx.globalAlpha = Math.max(0, ef.life / 900);
      ctx.fillStyle = ef.color;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ef.text, ef.x, ef.y);
      ctx.textAlign = 'left';
    }
  }
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // water-like bg gradient
  const g = ctx.createLinearGradient(0,0,0,CANVAS_H);
  g.addColorStop(0, '#0a1a30');
  g.addColorStop(1, '#061018');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

  // subtle bubbles bg
  ctx.fillStyle = 'rgba(100,180,255,0.03)';
  for (let i=0; i<30; i++) {
    const bx = (i*97 + Date.now()*0.01) % CANVAS_W;
    const by = (i*61 + Date.now()*0.015) % CANVAS_H;
    ctx.beginPath();
    ctx.arc(bx, by, 2+i%4, 0, Math.PI*2);
    ctx.fill();
  }

  drawGrid();
  drawPath();
  drawTowers();
  drawEnemies();
  drawProjectiles();
  drawParticles();
}

// ==================== MAIN LOOP ====================
function gameLoop(now) {
  if (!gameRunning) { requestAnimationFrame(gameLoop); return; }
  const dt = Math.min(50, now - lastTime);
  lastTime = now;

  // spawn
  spawnTimer += dt;
  while (spawnQueue.length && spawnTimer >= spawnQueue[0].delay) {
    const s = spawnQueue.shift();
    spawnEnemy(s.type);
  }

  updateEnemies(dt);
  updateTowers(dt, now);
  updateProjectiles(dt);
  updateParticles(dt);

  // next wave check
  if (spawnQueue.length === 0 && enemies.length === 0 && wave > 0) {
    if (wave >= maxWave) {
      endGame(true);
    } else {
      setTimeout(() => { if (gameRunning) startWave(); }, 2500);
    }
  }

  draw();
  requestAnimationFrame(gameLoop);
}

function endGame(win) {
  gameRunning = false;
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  document.getElementById('overlay-title').textContent = win ? '🎉 勝利！' : '💀 失敗…';
  document.getElementById('overlay-desc').textContent = win
    ? `你成功守護了狐仙聖地！共獲得大量金幣。`
    : `生命耗盡。再接再厲！`;
  document.getElementById('start-btn').classList.add('hidden');
  document.getElementById('restart-btn').classList.remove('hidden');
}

function resetGame() {
  gold = 150; lives = 20; wave = 0;
  towers = []; enemies = []; projectiles = []; particles = []; effects = [];
  spawnQueue = []; selectedTowerType = null; selectedPlaced = null;
  document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
  updateUI();
  updateSelectedInfo();
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('start-btn').classList.remove('hidden');
  document.getElementById('restart-btn').classList.add('hidden');
  gameRunning = true;
  lastTime = performance.now();
  startWave();
}

document.getElementById('start-btn').onclick = () => {
  document.getElementById('overlay').classList.add('hidden');
  gameRunning = true;
  lastTime = performance.now();
  startWave();
};
document.getElementById('restart-btn').onclick = resetGame;

// boot
buildPathBlocked();
initUI();
updateUI();
loadImages().then(() => {
  requestAnimationFrame(gameLoop);
  draw(); // initial draw
});
</script>
